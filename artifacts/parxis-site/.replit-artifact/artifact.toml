kind = "web"
previewPath = "/parxis/"
title = "Parxis — Motor Clínico"
version = "1.0.0"
id = "artifacts/parxis-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/parxis/" ]
localPort = 21575

[services.development]
run = "pnpm --filter @workspace/parxis-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parxis-site", "run", "build" ]
publicDir = "artifacts/parxis-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21575"
BASE_PATH = "/parxis/"
