openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PADCOM — Sistema de Gestão de Protocolos Injetáveis
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: substances
    description: Substance management
  - name: protocols
    description: Protocol management
  - name: sessions
    description: Session/appointment management
  - name: ras
    description: RAS - Registro de Administração de Substâncias
  - name: stock
    description: Stock management
  - name: payments
    description: Payment management
  - name: dashboard
    description: Dashboard and analytics
  - name: pharmacies
    description: Farmácias de manipulação e roteamento de receitas
  - name: prescriptions
    description: Prescrições e desmembramento em receitas
  - name: sncr
    description: Numeração SNCR de medicamentos controlados
  - name: catalog-options
    description: Opções gerenciáveis de listas (categorias, tipos)
  - name: site-content
    description: Conteúdo editável (fraseologia de botões, textos de pagamento, vídeos)
  - name: agenda
    description: Motor de Agenda — recursos, janelas, exceções e liberação anti-ilha

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # SUBSTANCES
  /substances:
    get:
      operationId: listSubstances
      tags: [substances]
      summary: List all substances
      responses:
        "200":
          description: List of substances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Substance"
    post:
      operationId: createSubstance
      tags: [substances]
      summary: Create a substance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubstanceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substance"

  /substances/{id}:
    put:
      operationId: updateSubstance
      tags: [substances]
      summary: Update substance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubstanceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substance"

  # PROTOCOLS
  /protocols:
    get:
      operationId: listProtocols
      tags: [protocols]
      summary: List all protocols
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of protocols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Protocol"
    post:
      operationId: createProtocol
      tags: [protocols]
      summary: Create a protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProtocolBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"

  /protocols/{id}:
    get:
      operationId: getProtocol
      tags: [protocols]
      summary: Get protocol by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Protocol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"
    put:
      operationId: updateProtocol
      tags: [protocols]
      summary: Update protocol
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProtocolBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"

  /protocols/{id}/validate:
    post:
      operationId: validateProtocol
      tags: [protocols]
      summary: Validate and generate sessions for a protocol
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Protocol validated and sessions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"

  /protocols/{id}/generate-ics:
    post:
      operationId: generateProtocolICS
      tags: [protocols]
      summary: Generate ICS file for protocol sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ICS content
          content:
            application/json:
              schema:
                type: object
                properties:
                  icsContent:
                    type: string
                  filename:
                    type: string
                required:
                  - icsContent
                  - filename

  # SESSIONS
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: protocolId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: professionalId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    put:
      operationId: updateSession
      tags: [sessions]
      summary: Update session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}/confirm-substance:
    post:
      operationId: confirmSubstanceApplication
      tags: [sessions]
      summary: Confirm application of a specific substance in a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                substanceId:
                  type: integer
                confirmed:
                  type: boolean
                notes:
                  type: string
              required:
                - substanceId
                - confirmed
      responses:
        "200":
          description: Substance confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  # RAS
  /ras:
    get:
      operationId: listRAS
      tags: [ras]
      summary: List RAS records
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: protocolId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of RAS records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RAS"
    post:
      operationId: createRAS
      tags: [ras]
      summary: Create a RAS record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRASBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAS"

  /ras/{id}:
    get:
      operationId: getRAS
      tags: [ras]
      summary: Get RAS by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RAS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAS"

  # STOCK
  /stock:
    get:
      operationId: listStock
      tags: [stock]
      summary: List stock items
      responses:
        "200":
          description: List of stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"
    post:
      operationId: createStockItem
      tags: [stock]
      summary: Create stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"

  /stock/{id}:
    put:
      operationId: updateStockItem
      tags: [stock]
      summary: Update stock item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"

  # PAYMENTS
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    put:
      operationId: updatePayment
      tags: [payments]
      summary: Update payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # PROFESSIONALS
  /professionals:
    get:
      operationId: listProfessionals
      tags: [clients]
      summary: List professionals
      responses:
        "200":
          description: List of professionals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Professional"
    post:
      operationId: createProfessional
      tags: [clients]
      summary: Create a professional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessionalBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /professionals/{id}:
    put:
      operationId: updateProfessional
      tags: [clients]
      summary: Update a professional
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfessionalBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /professional-areas:
    get:
      operationId: listProfessionalAreas
      tags: [clients]
      summary: List professional areas (catalog)
      parameters:
        - name: professionalType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of professional areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessionalArea"

  /professional-specialties:
    get:
      operationId: listProfessionalSpecialties
      tags: [clients]
      summary: List professional specialties (catalog), optionally filtered by area
      parameters:
        - name: areaId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of professional specialties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessionalSpecialty"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming-sessions:
    get:
      operationId: getUpcomingSessions
      tags: [dashboard]
      summary: Get upcoming sessions for the next 7 days
      responses:
        "200":
          description: Upcoming sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get operational alerts (stock low, missed sessions, pending payments)
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/protocol-stats:
    get:
      operationId: getProtocolStats
      tags: [dashboard]
      summary: Get protocol status breakdown and revenue stats
      responses:
        "200":
          description: Protocol statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolStats"

  # PHARMACIES
  /site-content:
    get:
      operationId: listSiteContent
      tags: [site-content]
      summary: List editable content (optionally filtered by category)
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of editable content items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteContent"
    post:
      operationId: createSiteContent
      tags: [site-content]
      summary: Create an editable content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteContentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"

  /site-content/{id}:
    patch:
      operationId: updateSiteContent
      tags: [site-content]
      summary: Update an editable content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteContentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"

  /scheduling/doctors:
    get:
      operationId: listSchedulingDoctors
      tags: [scheduling]
      summary: List assistant doctors (excludes Dr. Caio) with their agenda resource
      responses:
        "200":
          description: Assistant doctors available for Entrada 4
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulingDoctor"

  /scheduling/areas:
    get:
      operationId: listSchedulingAreas
      tags: [scheduling]
      summary: List professional areas that have bookable professionals, with their specialties
      responses:
        "200":
          description: Bookable areas with nested specialties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulingArea"

  /scheduling/professionals:
    get:
      operationId: listSchedulingProfessionals
      tags: [scheduling]
      summary: List bookable professionals, optionally filtered by area/specialty
      parameters:
        - name: areaId
          in: query
          required: false
          schema:
            type: integer
        - name: specialtyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Bookable professionals with agenda resource
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulingProfessional"

  /scheduling/requests:
    get:
      operationId: listSchedulingRequests
      tags: [scheduling]
      summary: List scheduling requests (admin), optionally filtered by entrada/status
      parameters:
        - name: entrada
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of scheduling requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulingRequest"
    post:
      operationId: createSchedulingRequest
      tags: [scheduling]
      summary: Create a scheduling request from a patient entrada (2, 3 or 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulingRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingRequest"

  /scheduling/requests/{id}:
    patch:
      operationId: updateSchedulingRequest
      tags: [scheduling]
      summary: Update a scheduling request status/notes (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulingRequestBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingRequest"

  /scheduling/requests/{id}/concierge-charge:
    post:
      operationId: createConciergeCharge
      tags: [scheduling]
      summary: Create (or reuse) the real Asaas Concierge charge for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                patientCpf:
                  type: string
      responses:
        "200":
          description: Existing charge reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeChargeResult"
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeChargeResult"

  /scheduling/requests/{id}/payment-status:
    get:
      operationId: getSchedulingPaymentStatus
      tags: [scheduling]
      summary: Poll the real-time payment status of a Concierge charge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingPaymentStatus"

  /catalog-options:
    get:
      operationId: listCatalogOptions
      tags: [catalog-options]
      summary: List catalog options (optionally filtered by kind)
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
        - name: all
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of catalog options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogOption"
    post:
      operationId: createCatalogOption
      tags: [catalog-options]
      summary: Create a catalog option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogOptionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOption"

  /catalog-options/{id}:
    patch:
      operationId: updateCatalogOption
      tags: [catalog-options]
      summary: Update a catalog option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogOptionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOption"
    delete:
      operationId: deleteCatalogOption
      tags: [catalog-options]
      summary: Delete (deactivate) a catalog option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /pharmacies:
    get:
      operationId: listPharmacies
      tags: [pharmacies]
      summary: List pharmacies
      responses:
        "200":
          description: List of pharmacies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pharmacy"
    post:
      operationId: createPharmacy
      tags: [pharmacies]
      summary: Create a pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
