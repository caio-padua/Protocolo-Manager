        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        active:
          type: boolean
        sortOrder:
          type: integer

    CreateAgendaResourceBody:
      type: object
      required: [name, kind, modality]
      properties:
        name:
          type: string
        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        sortOrder:
          type: integer

    UpdateAgendaResourceBody:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        active:
          type: boolean
        sortOrder:
          type: integer

    AgendaWindow:
