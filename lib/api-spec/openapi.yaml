        idIhe:
          type: integer
        bloco:
          type: string
        perguntaId:
          type: string
        pergunta:
          type: string
        tipoResposta:
          type: ["string", "null"]
        sistema:
          type: ["string", "null"]
        escalaValidada:
          type: ["string", "null"]
        pesoGravidade:
          type: ["integer", "null"]
        eSinalAlarme:
          type: ["boolean", "null"]
        obrigatorio:
