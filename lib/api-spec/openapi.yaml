      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulacaoInput"
      responses:
        "200":
          description: Resultado da simulacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacaoResultado"

  # ORCAMENTO - CATALOGO COMERCIAL
  /budget-catalog:
    get:
      operationId: listBudgetCatalog
      tags: [budget]
      summary: List budget catalog items
      responses:
        "200":
          description: List of budget catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetCatalogItem"
    post:
      operationId: createBudgetCatalogItem
      tags: [budget]
      summary: Create a budget catalog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCatalogItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCatalogItem"

  /budget-catalog/seed:
    post:
      operationId: seedBudgetCatalog
      tags: [budget]
      summary: Idempotently seed the budget catalog and settings row
      responses:
        "200":
          description: Seed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSeedResult"

  /budget-catalog/{id}:
    patch:
      operationId: updateBudgetCatalogItem
      tags: [budget]
      summary: Update a budget catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCatalogItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCatalogItem"
    delete:
      operationId: deleteBudgetCatalogItem
      tags: [budget]
      summary: Delete a budget catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ORCAMENTO - PARAMETRIZACAO
  /budget-settings:
    get:
      operationId: getBudgetSettings
      tags: [budget]
      summary: Get budget settings (single row, auto-created)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"
    put:
      operationId: updateBudgetSettings
      tags: [budget]
      summary: Update budget settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"

  # ORCAMENTO - CALCULO (stateless preview)
  /budgets/calculate:
    post:
      operationId: calculateBudget
      tags: [budget]
      summary: Compute scenarios A/B/C/free for a set of items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCalcInput"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCalcResult"

  # ORCAMENTO - ORCAMENTOS PERSISTIDOS
  /budgets:
    get:
      operationId: listBudgets
      tags: [budget]
      summary: List budgets
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      operationId: createBudget
      tags: [budget]
      summary: Create (save) a budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"

  /budgets/{id}:
    get:
      operationId: getBudget
      tags: [budget]
      summary: Get budget by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    patch:
      operationId: updateBudget
      tags: [budget]
      summary: Update a budget (items, status, chosen scenario)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    delete:
      operationId: deleteBudget
      tags: [budget]
      summary: Delete a budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # AGENDA — MOTOR DE AGENDA
  /agenda/resources:
    get:
      operationId: listAgendaResources
      tags: [agenda]
      summary: List agenda resources (seeds defaults if empty)
      responses:
        "200":
          description: List of agenda resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaResource"
    post:
      operationId: createAgendaResource
      tags: [agenda]
      summary: Create an agenda resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgendaResourceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaResource"

  /agenda/resources/{id}:
    put:
      operationId: updateAgendaResource
      tags: [agenda]
      summary: Update an agenda resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgendaResourceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaResource"

  /agenda/resources/{id}/windows:
    get:
      operationId: listAgendaWindows
      tags: [agenda]
      summary: List windows of a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaWindow"
    put:
      operationId: replaceAgendaWindows
      tags: [agenda]
      summary: Replace the whole weekly window set of a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAgendaWindowsBody"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaWindow"

  /agenda/exceptions:
    get:
      operationId: listAgendaExceptions
      tags: [agenda]
      summary: List agenda exceptions (holidays/blocks)
      responses:
        "200":
          description: List of exceptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaException"
    post:
      operationId: createAgendaException
      tags: [agenda]
      summary: Create an agenda exception
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgendaExceptionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaException"

  /agenda/exceptions/{id}:
    delete:
      operationId: deleteAgendaException
      tags: [agenda]
      summary: Delete an agenda exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agenda/settings:
    get:
      operationId: getAgendaSettings
      tags: [agenda]
      summary: Get the singleton agenda settings (creates defaults if missing)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaSettings"
    put:
      operationId: updateAgendaSettings
      tags: [agenda]
      summary: Update the agenda settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgendaSettingsBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaSettings"

  /agenda/slots:
    get:
      operationId: getAgendaSlots
      tags: [agenda]
      summary: Compute released/blocked/occupied slots for a resource on a date (anti-island engine)
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
        - name: occupied
          in: query
          required: false
          description: CSV de horarios HH:mm ja ocupados (apenas para a Prova Viva demonstrar a cadeia; a ocupacao real chega na marcacao, F2.3)
          schema:
            type: string
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaSlotsResponse"

  /agenda/book:
    post:
      operationId: bookAgendaSession
      tags: [agenda]
      summary: Mark a real session into an open slot (validated by the engine)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAgendaSessionBody"
      responses:
        "201":
          description: Session booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAgendaSessionResponse"

  /agenda/book/{id}:
    delete:
      operationId: cancelAgendaBooking
      tags: [agenda]
      summary: Cancel a booked session (removes its Google event if any)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAgendaSessionResponse"

  /agenda/limpar-simulacao:
    post:
      operationId: clearAgendaSimulations
      tags: [agenda]
      summary: Remove all sessions tagged as simulation and their Google events
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAgendaSimulationsBody"
      responses:
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearAgendaSimulationsResponse"

components:
  schemas:
    AgendaResource:
      type: object
      required: [id, name, kind, modality, color, slotMinutes, active, sortOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        active:
          type: boolean
        sortOrder:
          type: integer

    CreateAgendaResourceBody:
      type: object
      required: [name, kind, modality]
      properties:
        name:
          type: string
        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        sortOrder:
          type: integer

    UpdateAgendaResourceBody:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        modality:
          type: string
        color:
          type: string
        slotMinutes:
          type: integer
        professionalId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        active:
          type: boolean
        sortOrder:
          type: integer

    AgendaWindow:
      type: object
      required: [id, resourceId, weekday, startTime, endTime]
      properties:
        id:
          type: integer
        resourceId:
          type: integer
        weekday:
          type: integer
        startTime:
          type: string
        endTime:
          type: string

    AgendaWindowInput:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          type: integer
        startTime:
          type: string
        endTime:
          type: string

    ReplaceAgendaWindowsBody:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AgendaWindowInput"

    AgendaException:
      type: object
      required: [id, date, kind]
      properties:
        id:
          type: integer
        resourceId:
          type: integer
          nullable: true
        date:
          type: string
        kind:
          type: string
        description:
          type: string
          nullable: true

    CreateAgendaExceptionBody:
      type: object
      required: [date, kind]
      properties:
        resourceId:
          type: integer
          nullable: true
        date:
          type: string
        kind:
          type: string
          enum: [feriado, bloqueio]
        description:
          type: string
          nullable: true

    AgendaSettings:
      type: object
      required: [id, blockMinutes, triggerPercent, minLeadHours]
      properties:
        id:
          type: integer
        blockMinutes:
          type: integer
        triggerPercent:
          type: integer
        minLeadHours:
          type: integer

    UpdateAgendaSettingsBody:
      type: object
      properties:
        blockMinutes:
          type: integer
        triggerPercent:
          type: integer
        minLeadHours:
          type: integer

    AgendaSubBlock:
      type: object
      required: [startTime, endTime, released, total, occupied, occupancy]
      properties:
        startTime:
          type: string
        endTime:
          type: string
        released:
          type: boolean
        total:
          type: integer
        occupied:
          type: integer
        occupancy:
          type: integer

    AgendaSlot:
      type: object
      required: [time, state, subBlockIndex]
      properties:
        time:
          type: string
        state:
          type: string
        reason:
          type: string
          nullable: true
        subBlockIndex:
          type: integer

    AgendaSlotsResponse:
      type: object
      required: [resourceId, date, slots, subBlocks]
      properties:
        resourceId:
          type: integer
        date:
          type: string
        reason:
          type: string
          nullable: true
        subBlocks:
          type: array
          items:
            $ref: "#/components/schemas/AgendaSubBlock"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AgendaSlot"

    BookAgendaSessionBody:
      type: object
      required: [resourceId, clientId, protocolId, date, time]
      properties:
        resourceId:
          type: integer
        clientId:
          type: integer
        protocolId:
          type: integer
        date:
          type: string
        time:
          type: string
        serviceType:
          type: string
        unit:
          type: string
        syncGoogle:
          type: boolean
        simulate:
          type: boolean

    AgendaBookedSession:
      type: object
      required: [id, protocolId, clientId, scheduledDate, scheduledTime, status]
      properties:
        id:
          type: integer
        protocolId:
          type: integer
        clientId:
          type: integer
        resourceId:
          type: integer
          nullable: true
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        status:
          type: string
        unit:
          type: string
          nullable: true
        serviceType:
          type: string
        weekNumber:
          type: integer
        googleEventId:
          type: string
          nullable: true

    BookAgendaSessionResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/AgendaBookedSession"
        googleEventId:
          type: string
          nullable: true
        googleSyncWarning:
          type: string
          description: Presente quando a marcação foi salva mas a sincronização Google foi pulada (conta errada) ou falhou.

    ClearAgendaSimulationsResponse:
      type: object
      required: [removed, googleRemoved]
      properties:
        removed:
          type: integer
        googleRemoved:
          type: integer

    ClearAgendaSimulationsBody:
      type: object
      properties:
        clientId:
          type: integer
          description: Limita a limpeza às simulações deste cliente.
        protocolId:
          type: integer
          description: Limita a limpeza às simulações deste protocolo.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnamneseBloco:
      type: object
      required: [bloco, total]
      properties:
        bloco:
          type: string
        total:
          type: integer
        comAlarme:
          type: integer
        comEscala:
          type: integer

    AnamneseOpcao:
      type: object
      required: [label, valor, peso]
      properties:
        label:
          type: string
        valor:
          oneOf:
            - type: string
            - type: number
        peso:
          type: number

    AnamnesePergunta:
      type: object
      required: [id, perguntaId, pergunta, bloco]
      properties:
        id:
          type: integer
        idIhe:
          type: integer
        bloco:
          type: string
        perguntaId:
          type: string
        pergunta:
          type: string
        tipoResposta:
          type: ["string", "null"]
        sistema:
          type: ["string", "null"]
        escalaValidada:
          type: ["string", "null"]
        pesoGravidade:
          type: ["integer", "null"]
        eSinalAlarme:
          type: ["boolean", "null"]
        obrigatorio:
          type: ["string", "null"]
        ordem:
          type: ["integer", "null"]
        opcoes:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AnamneseOpcao"

    AnamnesePerguntaUpdate:
      type: object
      properties:
        bloco:
          type: string
        pergunta:
          type: string
        tipoResposta:
          type: string
        sistema:
          type: string
        escalaValidada:
          type: string
        pesoGravidade:
          type: integer
        eSinalAlarme:
          type: boolean
        ordem:
          type: integer
        opcoes:
          type: array
          items:
            $ref: "#/components/schemas/AnamneseOpcao"

    AnamneseSintoma:
      type: object
      required: [codigoSemantico]
      properties:
        codigoSemantico:
          type: string
        nomeSintoma:
          type: ["string", "null"]

    AnamneseAmarracaoSintoma:
      type: object
      required: [id, perguntaId, sintomaCodigo]
      properties:
        id:
          type: integer
        perguntaId:
          type: string
        sintomaCodigo:
          type: string
        nomeSintoma:
          type: ["string", "null"]
        gatilhoValor:
          type: ["string", "null"]
        peso:
          type: ["integer", "null"]

    AnamneseAmarracaoDoenca:
      type: object
      required: [id, perguntaId, doencaIdIhe]
      properties:
        id:
          type: integer
        perguntaId:
          type: string
        doencaIdIhe:
          type: integer
        nomeDoenca:
          type: ["string", "null"]
        gatilhoValor:
          type: ["string", "null"]
        peso:
          type: ["integer", "null"]

    AnamneseAmarracoes:
      type: object
      required: [sintomas, doencas]
      properties:
        sintomas:
          type: array
          items:
            $ref: "#/components/schemas/AnamneseAmarracaoSintoma"
        doencas:
          type: array
          items:
            $ref: "#/components/schemas/AnamneseAmarracaoDoenca"

    AmarracaoSintomaInput:
      type: object
      required: [perguntaId, sintomaCodigo]
      properties:
        perguntaId:
          type: string
        sintomaCodigo:
          type: string
        gatilhoValor:
          type: string
        peso:
          type: integer

    DeleteResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    SimulacaoRespostaItem:
      type: object
      required: [perguntaId, valor]
      properties:
        perguntaId:
          type: string
        valor:
          oneOf:
            - type: string
            - type: number

    SimulacaoInput:
      type: object
      required: [respostas]
      properties:
        respostas:
          type: array
          items:
            $ref: "#/components/schemas/SimulacaoRespostaItem"

    SimulacaoBlocoEscore:
      type: object
      required: [bloco, escore, grade]
      properties:
        bloco:
          type: string
        escore:
          type: number
        grade:
          type: string

    SimulacaoSinalAlarme:
      type: object
      required: [perguntaId, pergunta]
      properties:
        perguntaId:
          type: string
        pergunta:
          type: string

    SimulacaoResultado:
      type: object
      required: [escoreTotal, gradeGlobal, blocos, sintomas, doencas, exames, alarmes]
      properties:
        escoreTotal:
          type: number
        gradeGlobal:
          type: string
        blocos:
          type: array
          items:
            $ref: "#/components/schemas/SimulacaoBlocoEscore"
        sintomas:
          type: array
          items:
            type: string
        doencas:
          type: array
          items:
            type: string
        exames:
          type: array
          items:
            type: string
        alarmes:
          type: array
          items:
            $ref: "#/components/schemas/SimulacaoSinalAlarme"

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cpf:
          type: string
        email:
          type: string
        phone:
          type: string
        birthDate:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        pais:
