        comEscala:
          type: integer

    AnamneseOpcao:
      type: object
      required: [label, valor, peso]
      properties:
        label:
          type: string
        valor:
          oneOf:
            - type: string
            - type: number
        peso:
          type: number

    AnamnesePergunta:
      type: object
      required: [id, perguntaId, pergunta, bloco]
      properties:
        id:
